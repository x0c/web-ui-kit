name: Release Tarballs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to package and attach to its GitHub Release (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install, verify, and pack release tarballs
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run typecheck
          pnpm run lint
          pnpm run build:playground
          rm -rf dist-release && mkdir -p dist-release
          pnpm --filter @x0c/tokens pack --pack-destination dist-release
          pnpm --filter @x0c/ui pack --pack-destination dist-release
          (cd dist-release && sha256sum x0c-tokens-*.tgz x0c-ui-*.tgz > SHA256SUMS)
          ls -la dist-release
          cat dist-release/SHA256SUMS

      - name: Upload tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "web-ui-kit ${RELEASE_TAG}" --generate-notes
            gh release upload "$RELEASE_TAG" dist-release/x0c-tokens-*.tgz dist-release/x0c-ui-*.tgz dist-release/SHA256SUMS --clobber
          elif [ "$IS_DISPATCH" = "true" ] || [ "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = "0" ]; then
            gh release upload "$RELEASE_TAG" dist-release/x0c-tokens-*.tgz dist-release/x0c-ui-*.tgz dist-release/SHA256SUMS --clobber
          else
            echo "Release ${RELEASE_TAG} already has immutable tarball assets; skipping overwrite."
          fi
